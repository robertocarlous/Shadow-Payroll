name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Compile contract + run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Pin the compiler: contracts/payroll.compact declares
      # `pragma language_version 0.23`, which toolchain 0.31.1 provides.
      # `compact update` (no version) tracks the latest toolchain, whose
      # language version has since moved past 0.23 and would fail to compile.
      - name: Fetch Compact compiler (pinned to language version 0.23)
        run: compact update 0.31.1

      - name: Install dependencies
        run: npm ci

      - name: Compile the contract (TS bindings + ZK circuits)
        run: npm run compile

      - name: Run contract test suite
        run: npm test

      - name: Typecheck
        run: npm run build

      # frontend/src/generated/payroll and frontend/public/managed/payroll
      # are vendored copies of the compile output above (Vercel has no
      # Compact toolchain, so the frontend can't compile at deploy time —
      # see frontend/scripts/sync-contract.mjs). They're committed, so a
      # contract change with no re-sync silently ships a frontend whose
      # claim flow proves against the wrong keys. This step catches that
      # by re-running the sync against this compile and failing if it
      # produces a diff, i.e. the committed vendored copy is stale.
      - name: Verify frontend contract assets are in sync
        run: |
          node frontend/scripts/sync-contract.mjs
          if ! git diff --quiet -- frontend/src/generated frontend/public/managed; then
            echo "::error::frontend/src/generated and/or frontend/public/managed are out of sync with contracts/payroll.compact."
            echo "Run 'npm run compile' at the repo root, then 'node scripts/sync-contract.mjs' in frontend/, and commit the result."
            git --no-pager diff --stat -- frontend/src/generated frontend/public/managed
            exit 1
          fi

  frontend:
    name: Build audit dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
